<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="96" height="96" fill="url(#bg)" rx="20"/>

  <!-- Forge / hammer icon -->
  <g transform="translate(48, 48)">
    <!-- Hammer head -->
    <rect x="-22" y="-18" width="28" height="14" fill="#fff" rx="2"/>
    <!-- Hammer handle -->
    <rect x="4" y="-12" width="18" height="8" fill="#fff" rx="2" transform="rotate(35, 4, -12)"/>
    <!-- Sparkle dots -->
    <circle cx="-18" cy="14" r="2.5" fill="#fff"/>
    <circle cx="18" cy="14" r="2.5" fill="#fff"/>
    <circle cx="0" cy="22" r="2" fill="#fff"/>
  </g>
</svg>
